
trigger:
  branches:
    include:
      - feature/poe-part-3-work

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 8 SDK'
    inputs:
      packageType: 'sdk'
      version: '8.x'

  - task: DotNetCoreCLI@2
    displayName: 'Restore NuGet packages'
    inputs:
      command: 'restore'
      projects: '**/*.csproj'

  - task: DotNetCoreCLI@2
    displayName: 'Build ASP.NET Core project'
    inputs:
      command: 'build'
      projects: 'APPR_POE_FINAL.csproj'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  - task: DotNetCoreCLI@2
    displayName: 'Build Azure Functions project'
    inputs:
      command: 'build'
      projects: 'GiftoftheGivers.Functions/GiftoftheGivers.Functions.csproj'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  - task: DotNetCoreCLI@2
    displayName: 'Run Unit and Integration Tests'
    inputs:
      command: 'test'
      projects: 'APPR_POE_FINAL.Tests/APPR_POE_FINAL.Tests.csproj'
      publishTestResults: true
      arguments: '--configuration $(buildConfiguration) --no-restore --filter "FullyQualifiedName!~SeleniumTests"'
